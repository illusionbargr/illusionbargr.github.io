    style='font-size:11.0pt;font-family:"Times New Roman";color:white;
    language:EL'>Απλές ερωτήσεις για κοινούς ανθρώπους; Κοινές ερωτήσεις για κοινές απαντήσεις; Στην ουσία δεν υπάρχει απάντηση, γιατί αυτές οι ερωτήσεις είναι ανούσιες χωρίς κανένα νόημα. </span></p>

    margin-bottom:14.0pt;text-align:justify;text-justify:inter-word'><span
    style='font-size:11.0pt;font-family:"Times New Roman";color:white;
    language:EL'>Ο Θεός έδωσε το πνέυμα ακατέργαστο και απλό. Όταν παραμένει έτσι, τότε μπορείς να απαντήσεις σε αυτές τις ερωτήσεις. Η αλήθεια είναι οτί δυσκολία δεν υπάρχει. Όλα τα πράγματα παίρνουν την ροή που θέλουμε εμείς. Δεν υπάρχει δυσκολία στην καθημερινή ζωή. Το μόνο δύσκολο είναι να κατεργαστείς το πνεύμα σου. Ακατόρθωτο αυτό για τους απλούς ανθρώπους. Δεν υπάρχει καθοδηγητής. Όταν το πνεύμα είναι σε έξαρση, γυρίζεις τον κόσμο ανάποδα. </span></p>

    style='font-size:11.0pt;font-family:"Times New Roman";color:white;
    language:EL'>Η δυναμή του νού ανατρέπει τις δυσκολίες. Είναι σκληρός ο αγώνας για την κατάκτηση του πνεύματος. Όμως μετά ανταμοίβεσαι εις τους αιώνας των αιώνων. Το πνεύμα όμως με δυσκολία κατακτίεται. Είσαι διαρκής σε μια ζώνη αντιθέσεων. Είσαι στον ουρανό και πέφτεις στην γή. Είσαι στην θάλασσα και καίγεσαι από πυρακτωμένη φλόγα. Είσαι σε καταπράσινη φύση και σκεπάζεσαι από χιόνι. Νιώθεις χαρά και πνίγεσαι από απογοήτευση. </span></p>

    language:EL'>Αυτό σημαίνει ότι όλα τα πράγματα αναιρούνται. Το ωραίο του πράγματος είναι να σου αρέσει η αντίθεση που νιώθεις. Να ηδονίζεσαι από την ζώνη των αναιρέσεων. Τότε το πνέυμα αναπτύσεται ακάθεκτο προς την κορυφή. Τότε βγαίνεις νικητής. Τότε είσαι επιτυχημένος. ’σε το πνέυμα σου να σε καθοδηγήσει. Εκεί που μόνο αυτό ξέρει πως να επιβιώνει. Πνευματικός άνθρωπος είναι αυτός που ο νούς και η καρδία χτυπούν στους ίδιους ρυθμούς. </span></p>
